set -g mouse on
set -g history-limit 10000
# urxvt reports buttonless motion as a button-1 drag in any-event mouse mode,
# so the first click after leaving a mouse-tracking pane arrives as a drag end
bind -n MouseDragEnd1Status select-window -t =

# Ctrl+Tab / Ctrl+Shift+Tab: cycle windows in most-recently-used order.
# urxvt's ctrltab extension (~/.config/urxvt/ext/ctrltab) sends private
# sequences for the presses and for releasing Ctrl; other terminals that send
# C-Tab fall back to a timeout to end the cycle.
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
set -s user-keys[2] "\e[9003~"
bind -n User0 run-shell "~/.config/tmux/mru.sh next 1 '#{session_id}' '#{window_id}' hold"
bind -n User1 run-shell "~/.config/tmux/mru.sh next -1 '#{session_id}' '#{window_id}' hold"
bind -n User2 run-shell "~/.config/tmux/mru.sh release '#{session_id}'"
bind -n C-Tab run-shell "~/.config/tmux/mru.sh next 1 '#{session_id}' '#{window_id}'"
bind -n C-S-Tab run-shell "~/.config/tmux/mru.sh next -1 '#{session_id}' '#{window_id}'"
bind -n C-BTab run-shell "~/.config/tmux/mru.sh next -1 '#{session_id}' '#{window_id}'"
set-hook -g session-window-changed "run-shell -b \"~/.config/tmux/mru.sh push '#{session_id}'\""

# refresh the X session's variables on attach: a server older than the X session
# would otherwise give new windows dead values (Firefox opened from them can't reach
# the running instance over a stale DBUS_SESSION_BUS_ADDRESS); one the attaching
# client lacks, like a leftover DESKTOP_STARTUP_ID, is removed
set -ga update-environment DBUS_SESSION_BUS_ADDRESS
set -ga update-environment SESSION_MANAGER
set -ga update-environment DESKTOP_STARTUP_ID
